# Conda environment used for every result in the paper.
#
# Faithful export from the machine described in Section 5.1 of the manuscript
# (Dell OptiPlex 3000 MT, Intel Core i5-12500, 16 GB RAM, no discrete GPU,
# Windows 10 Professional). All training was CPU-only.
#
# NOTES
#  * This export was taken on Windows, so it pins Windows-only runtime packages
#    (vc, vs2015_runtime, ucrt, win_inet_pton, wincertstore, pyreadline3).
#    On Linux or macOS, remove those lines; everything else resolves.
#  * gym-donkeycar is NOT in this export -- it was installed from source.
#    The experiments used the araffin FORK, not the upstream package:
#      pip install git+https://github.com/araffin/gym-donkeycar-1.git
#    It reports package version 21.02.20, inherited from the upstream release it
#    branched from. The DonkeySim binary must be downloaded separately.
#  * The version pins matter. stable-baselines3 1.5.0 requires the pre-0.26 Gym
#    step API, so gym must stay at 0.21.0. Upgrading either will break training.
#  * torch 1.13.1 here is the CPU build.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate donkeyenv2
